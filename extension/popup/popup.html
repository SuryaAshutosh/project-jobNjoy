<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .logo {
      width: 30px;
      height: 30px;
      margin-right: 10px;
      background-color: #3b82f6;
      border-radius: 4px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
    }
    .button {
      width: 100%;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .button:hover {
      background-color: #2563eb;
    }
    .status {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <div class="title">JobBuddy Assistant</div>
  </div>
  
  <button id="parseJob" class="button">Parse Current Job</button>
  <button id="autoFill" class="button">Auto-fill Application</button>
  
  <div class="status" id="status">Ready</div>
  
  <script src="popup.js"></script>
</body>
</html>

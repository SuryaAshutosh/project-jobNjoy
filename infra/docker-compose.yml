version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: jobbuddy-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-jobbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobbuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - jobbuddy-network

  # Redis for caching and background jobs
  redis:
    image: redis:7-alpine
    container_name: jobbuddy-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jobbuddy-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobbuddy-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobbuddy:jobbuddy@db:5432/jobbuddy
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - jobbuddy-network

  # Frontend (commented out due to compilation errors)
  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_URL=http://localhost:8000
  #   container_name: jobbuddy-frontend
  #   restart: always
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - jobbuddy-network

  # Nginx reverse proxy (commented out due to frontend dependency)
  # nginx:
  #   image: nginx:alpine
  #   container_name: jobbuddy-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - jobbuddy-network

networks:
  jobbuddy-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: